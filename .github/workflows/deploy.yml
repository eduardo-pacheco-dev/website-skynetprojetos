name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    name: Deploy to VPS
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        id: config
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_APP_PATH" ]; then
            echo "::warning::Deploy ignorado. Configure VPS_SSH_KEY, VPS_HOST, VPS_USER e VPS_APP_PATH nos secrets do repositório."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          PORT="${VPS_PORT:-22}"

          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$PORT" -t ed25519 "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          fi

          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Validate deploy key
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > "$HOME/.ssh/deploy_key.pub"
          echo "Fingerprint da chave de deploy:"
          ssh-keygen -lf "$HOME/.ssh/deploy_key.pub"
          echo
          echo "Adicione esta chave pública ao authorized_keys do usuário ${{ secrets.VPS_USER }} na VPS:"
          cat "$HOME/.ssh/deploy_key.pub"

      - name: Deploy over SSH
        if: steps.config.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_PHP_BIN: ${{ secrets.VPS_PHP_BIN }}
          VPS_HEALTHCHECK_URL: ${{ secrets.VPS_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          PHP_BIN="${VPS_PHP_BIN:-php}"

          APP_PATH_Q=$(printf '%q' "$VPS_APP_PATH")
          PHP_BIN_Q=$(printf '%q' "$PHP_BIN")
          HEALTHCHECK_Q=$(printf '%q' "${VPS_HEALTHCHECK_URL:-}")

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "APP_PATH=$APP_PATH_Q PHP_BIN=$PHP_BIN_Q HEALTHCHECK_URL=$HEALTHCHECK_Q bash -s" \
            < scripts/deploy.sh
